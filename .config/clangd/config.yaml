CompileFlags:
  Add:
  - -xc # Treat all files as C
  - -Wall
  - -Wextra
  - -Wpedantic

  - -Wnull-dereference
  - -Wunreachable-code
  - -Wformat=2
  - -Wstack-usage=8192 # (Example) Prevents stack overflows.

  - -Wshadow
  - -Wconversion
  - -Werror=incompatible-pointer-types
  - -Wuninitialized
  - -Wimplicit-void-ptr-cast
  - -Wmaybe-uninitialized
  - -Wno-missing-field-initializers

  - -Wno-language-extension-token # gcc extensions: (typeof).
  - -Wno-gnu-statement-expression    # gcc extensions: GNU statement expressions.


  # Allow passing no arguments to variadic arguments:
  # https://github.com/meekrosoft/fff/issues/53
  - -Wno-variadic-macro-arguments-omitted


  # Warnings I'm not too sure about: ↓↓↓
  #- -Wmissing-prototypes
  #- -Werror
  #- -Wno-unused-const-variable
  #- -Wno-sign-conversion
  #- -Wfloat-equal
  #- -Wno-float-equal
  #- -Wc++-compat

  # Let clangd consume all my computer memory: ↓↓↓ :)
  # But seriously this solves: https://github.com/clangd/clangd/issues/2366
  - -ferror-limit=0

